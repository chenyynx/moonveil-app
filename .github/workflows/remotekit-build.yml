name: RemoteKit Build
# Fast compile gate for the AAV2 wiring ledger + Glue (swift build ~minutes, not the
# full app build). Pushed only on RemoteKit changes to spare macOS minutes (10x).
on:
  push:
    branches: [main]
    paths:
      - 'Packages/RemoteKit/**'
      - '.github/workflows/remotekit-build.yml'
  pull_request:
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pin Xcode 26.2 (same pin as iOS Build; 26.6 OOM precedent)
        run: sudo xcode-select -s /Applications/Xcode_26.2.app
      - name: swift build RemoteKit
        run: |
          cd Packages/RemoteKit
          # Log persistence quirk: Actions blob logs intermittently undownloadable
          # (EOF from CI + browser both hit it, 2026-09-15). Echo the error surface
          # into the job summary so `gh api check-runs/<id>/output` always yields it.
          set +o pipefail   # PIPESTATUS capture stays reachable (ios-build.yml ritual)
          rc=0
          # [CIFIX-RK-GATE 2026-09-21] 原写法 `pipeline || rc=${PIPESTATUS[0]}` 在
          # pipefail 关闭下永不触发（管道 exit = tail 的 0）→ rc 恒 0 → swift build
          # 失败也绿（假门禁，V2DashboardRepository 缺符号类型错误即被吞）。
          # 改为管道后无条件读 PIPESTATUS[0]。
          swift build 2>&1 | tee /tmp/rk-build.log | tail -80
          rc=${PIPESTATUS[0]}
          if [ "$rc" != 0 ]; then
            {
              echo '### swift build errors'
              echo '```'
              grep -E 'error:' /tmp/rk-build.log | grep -v '`-' | sort -u | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Checks API caps a check run at 50 annotations (docs.github.com REST
            # checks/runs); head -50 spends the full retrievable budget, 700 chars
            # keeps file:line + the whole diagnostic on one line.
            grep -E 'error:' /tmp/rk-build.log | grep -v '`-' | sort -u | head -50 | \
              while IFS= read -r line; do echo "::error::${line:0:700}"; done
            exit 1
          fi
      - name: Upload full build log (blob-log EOF insurance)
        # Same 2026-09-15/09-20 blob-log EOF class as iOS Build: gh run download
        # rk-build-log-<run_id> always yields the complete swift build log.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rk-build-log-${{ github.run_id }}
          path: /tmp/rk-build.log
          retention-days: 7
