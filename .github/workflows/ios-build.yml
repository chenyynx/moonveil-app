name: iOS Build
# Ported from claudio ios-build.yml (battle-tested recipe on this codebase family).
# Trigger: code changes on main; docs/rule-only commits do not burn macOS minutes (10x).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install deps toolchain
        # lld is a separate Homebrew formula since LLVM was split (2026).
        # brew meson instead of pip3: runner Python is PEP-668 managed.
        run: brew install meson ninja llvm lld libarchive pkg-config go

      - name: Prepare xcconfig
        run: |
          cd src/ios
          cp Configs/ProviderCustomization.xcconfig.example Configs/ProviderCustomization.xcconfig

      - name: Cache native deps build artifacts
        # Cache PRODUCT dirs only (never source trees) — claudio 8e41c86 lesson.
        uses: actions/cache@v4
        with:
          path: |
            deps/lame-build
            deps/frameworks
            deps/ish/build-ios
          key: deps-${{ runner.os }}-${{ hashFiles('deps/build_lame.sh', 'deps/build_ffmpeg.sh', 'deps/build_ish.sh', 'deps/build_rclone_ios.sh') }}

      - name: Cache xcodebuild DerivedData
        uses: actions/cache@v4
        with:
          path: src/ios/build/DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('src/ios/**', 'Packages/**') }}

      - name: Build native deps (lame → ffmpeg → ish → rclone → alpine rootfs)
        run: |
          # VDSO needs lld; meson picks `clang` from PATH, so brew LLVM must lead.
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin:$PATH"
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/build_rclone_ios.sh
          # Real Alpine rootfs — iSH sandbox needs it at boot; stub zip breaks with
          # "Failed to open zip archive" (claudio lesson).
          ./deps/prepare_alpine_rootfs.sh

      - name: Pin Xcode 26.2 (stable)
        # macos-26 default Xcode drifts (26.5->26.6 on 2026-07-21); on this codebase
        # 26.6 kills xcodebuild SILENTLY mid-build (OOM signature, claudio 3e78947,
        # 3 failures 2026-09-01). Pin the last stable so builds are reproducible.
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Build (unsigned) + package ipa
        run: |
          cd src/ios
          # Incremental + -disable-batch-mode kept from claudio diag recipe:
          # first Moonveil builds must surface real compile errors, not die
          # silently in WMO batch mode. Revisit for speed once green streak holds.
          # SWIFT_NUM_THREADS=2: OOM guard on macos-26 runners (claudio, Aug 2026).
          set +o pipefail   # PIPESTATUS capture stays reachable under bash -e
          xcodebuild build \
            -project Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_DEBUG_DYLIB=NO \
            SWIFT_NUM_THREADS=2 \
            SWIFT_COMPILATION_MODE=incremental \
            'OTHER_SWIFT_FLAGS=-Xfrontend -disable-batch-mode' \
            -derivedDataPath build/DerivedData 2>&1 | tee /tmp/ios-build.log | tail -150
          XB=${PIPESTATUS[0]}
          if [ "$XB" -ne 0 ]; then
            # Log-bucket EOF hit twice (2026-09-15): mirror the error surface into
            # the job summary so gh api check-runs/<id> always yields it.
            { echo '### xcodebuild error surface'; echo '```'; \
              grep -E 'error:' /tmp/ios-build.log | grep -v ' *|' | sort -u | head -60; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            # Annotations: checks API hard-caps a check run at 50 annotations
            # (docs.github.com REST checks/runs: "maximum of 50 annotations");
            # head -50 takes exactly the retrievable budget, 700 chars keeps
            # file:line:col + full diagnostic text on one line. Anything beyond
            # that lives in the ios-build-log artifact (gh run download).
            grep -E 'error:' /tmp/ios-build.log | grep -v ' *|' | sort -u | head -50 | \
              while IFS= read -r line; do echo "::error::${line:0:700}"; done
            # [PROBE 2026-09-15] permitsRetry paradox: same 6.2 compiler, macOS
            # swift-build(v5-pinned)=green vs Xcode=red. What did the frontend ACTUALLY
            # receive? Emit histogram + effective settings via proven annotation channel.
            { grep -oE -- '-swift-version [^ ]+' /tmp/ios-build.log | sort | uniq -c | \
                while IFS= read -r l; do echo "::error::PROBE version-histogram:${l}"; done; \
              grep -c 'permitsRetry' /tmp/ios-build.log | xargs -I{} echo "::error::PROBE permitsRetry-lines:{}"; \
              xcodebuild -showBuildSettings -project Minis.xcodeproj -target Minis \
                -configuration Release 2>/dev/null | grep -E 'SWIFT_VERSION|STRICT_CONCURRENCY|SWIFT_UPCOMING_FEATURE|SWIFT_APPROACHABLE_CONCURRENCY|SWIFT_DEFAULT_ACTOR_ISOLATION' | \
                sed 's/^ *//' | while IFS= read -r l; do echo "::error::PROBE setting:${l:0:120}"; done; \
            } | head -15
            exit 1
          fi
          # [CONFIG-PROOF 2026-09-21] Track C rests on Xcode 26.2 honouring
          # SWIFT_APPROACHABLE_CONCURRENCY. A green build alone cannot tell "key worked"
          # from "key silently ignored" — echo resolved settings on EVERY run so one CI
          # cycle is proof either way.
          { echo '### resolved Swift concurrency settings (Minis/Release)'; echo '```'; \
            xcodebuild -showBuildSettings -project Minis.xcodeproj -target Minis \
              -configuration Release 2>/dev/null \
              | grep -E 'SWIFT_APPROACHABLE_CONCURRENCY|SWIFT_DEFAULT_ACTOR_ISOLATION|SWIFT_VERSION|SWIFT_STRICT_CONCURRENCY' \
              | sed 's/^ *//'; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/Minis.app build/Payload/
          # CFBundleVersion = run number (monotonic, clone-depth independent — claudio 2026-09-09).
          BUILD_NO=${{ github.run_number }}
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NO" build/Payload/Minis.app/Info.plist
          echo "CFBundleVersion set to $BUILD_NO"
          cd build
          zip -qr "Moonveil-unsigned-${GITHUB_SHA::7}.ipa" Payload

      - name: Whole-module typecheck (complete error surface)
        # INFORMATIONAL ONLY — never gates this job (see script header for why).
        # The build above dies on the first failing file, so each 15-minute cycle
        # only ever reveals the next dependency layer; that is what made this repo
        # burn 14 straight red runs. This step replays the app target's OWN logged
        # swiftc invocation as one whole-module -typecheck, which reports every
        # remaining error in a single pass. Results land in the step summary and as
        # annotations, i.e. the two channels that survived the blob-log EOF outages.
        if: always()
        continue-on-error: true
        timeout-minutes: 35
        run: |
          set -uo pipefail
          python3 scripts/swift-full-typecheck.py --log /tmp/ios-build.log \
            --out /tmp/full-typecheck.log || echo "[full-typecheck] pass did not complete (see verdict line above)"
      - name: Upload full build log (blob-log EOF insurance)
        # Actions blob log storage intermittently undownloadable (2026-09-15 x2,
        # 2026-09-20 again): keep the WHOLE xcodebuild log as an artifact so
        # `gh run download <id> -n ios-build-log` always yields the error surface.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log-${{ github.run_id }}
          path: /tmp/ios-build.log
          retention-days: 7

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonveil-unsigned-ipa
          path: src/ios/build/*.ipa
          retention-days: 14
