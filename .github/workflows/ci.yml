name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: secret-scan
        uses: gitleaks/gitleaks-action@v2
      - name: import-direction
        run: bash scripts/import-scan.sh
      - name: fork-point
        run: bash scripts/fork-point-audit.sh
      - name: aav2-freeze
        run: bash scripts/aav2-freeze-check.sh
