name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: gitleaks range-scans multi-commit pushes; shallow clone
          # made `base^..head` unresolvable -> ERR "partial scan" exit 1 (2026-09-15)
          fetch-depth: 0
      # [CI-FIX-2026-09-17] gitleaks-action v2 now hard-fails without a paid
      # GITLEAKS_LICENSE ("License key validation will be enforced") and died
      # on anonymous API rate limits — run the OSS binary directly instead.
      # Same scan surface: full git history (fetch-depth: 0), repo .gitleaks.toml.
      - name: secret-scan
        run: |
          # Pinned release tarball: the raw install.sh one-liner 404s now, and
          # v8.30+ strictly validates .gitleaks.toml (config fixed to [[rules]]+id).
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --verbose
      - name: import-direction
        run: bash scripts/import-scan.sh
      - name: import-direction-deep-scan
        # Deep mode = full generated word list instead of the 6 hardcoded names.
        # [SEAM 2026-09-22] Registry refreshed 211 -> 312 words; the 83 symbols it
        # exposed are 100% inside src/ios/Views/RemoteSessions (41 of its 58 files,
        # ported AA components + remote-line pages). NO banned word removed, NO grep
        # pattern narrowed.
        # pp decision 2026-09-22: those 41 files are sanctioned individually via
        # scripts/rk-seam-files.txt -- NOT by registering the directory, which would
        # leave this step unable to ever fire for the one place that keeps growing
        # RemoteKit references. New offender => new row => the diff is the review point.
        env:
          RK_GATE_FULL_SCAN: "1"
        run: bash scripts/import-scan.sh
      - name: remote-archive-payload-losslessness
        # Structural backstop for the four archive write paths' lossless return:
        # Bool/Void regressions die in iOS Build, silent empty-payload /
        # argument-less-trigger degradations compile fine - this gate catches those.
        run: bash scripts/remote-archive-payload-gate.sh
      - name: rk-registry-freshness
        # [SEAM-LOSSLESS 2026-09-22] Landed together with the seam registration above:
        # list is 312 words and fresh; --check now hard-blocks future drift
        # (teeth: deleting one line -> exit 1, verified locally).
        run: python3 scripts/gen_rk_registry.py --check
      - name: pbxproj-input-audit
        run: |
          python3 -m pip install --quiet openstep-parser
          python3 scripts/audit-project-inputs.py
      - name: aa-assets-completeness
        run: python3 scripts/audit-aa-assets.py
      - name: fork-point
        run: bash scripts/fork-point-audit.sh
      - name: aav2-freeze (structure + manifest + pinned-upstream baseline)
        # Byte-level verbatim gate vs upstream rev 1bc11f45. Anchor raised 2026-09-22
        # from v2.0.0 (=10300fd5) after adjudicating the two files that looked like local
        # edits but were BASELINE LAG: MarkdownBlockSizing.swift and
        # TimelineHistoryPull.swift entered this repo in one commit (6582129), untouched
        # since, and their bytes equal upstream 1bc11f45 (Doris ported them from a state
        # 27 commits past v2.0.0). Reverting them to v2.0.0 verbatim is compiler-red
        # (ChatTimelineView needs TimelineHistoryPull(edge:) + Equatable, absent there),
        # and labelling upstream changes as our own approved deviation would be a lie --
        # so the anchor moved instead, and the --structure-only crutch is gone.
        # Default mode = disk<->manifest structure assertion + manifest digests + every
        # file vs the committed upstream baseline (scripts/aav2-freeze-baseline.txt). The
        # runner has no copy of the official repo, so that committed list IS the CI-side
        # anchor; strong mode (MV_CLOUD set) additionally re-derives and audits it.
        # Green at 1bc11f45: Network/HTTPTransport.swift is the pp-signed AAV2-AWAIT-1
        # sed, normalized by expected_bytes(). The baseline must only ever be derived
        # from $MV_CLOUD -- re-sha256ing it from local files is how this gate dies.
        run: bash scripts/aav2-freeze-check.sh
      - name: authaa-freeze (verbatim AuthAA/SettingsSkin vs pinned upstream)
        # Second zone of the shared freeze engine (scripts/freeze-check.sh): the 8
        # byte-identical Agents-Anywhere files under src/ios/Views/AuthAA and
        # src/ios/Views/SettingsSkin had ZERO gate coverage before 2026-09-22. Same
        # anchor 1bc11f45. The 10 intentionally-skinned / no-upstream files are
        # allow-listed in scripts/authaa-skin-allowlist.txt; any file in those dirs that
        # is in neither list fails the structure assertion.
        run: bash scripts/authaa-freeze-check.sh
      # [GATE-SWIFT-LINUX 2026-09-21] Syntax-layer gates that used to be caught only
      # by 8-18min macOS iOS Build: strict pbxproj grammar (55x missing-';' class),
      # disk->pbxproj registration (V2PreparedSession class), swiftc -parse sweep
      # (syntax class), case-mirror symbol spelling (contentmodifier class).
      - name: pbxproj-strict-syntax
        run: python3 scripts/pbxproj-strict-check.py
      - name: swift-reverse-registration
        # dependency install mirrors the input-audit step; idempotent pip (<2s)
        run: |
          python3 -m pip install --quiet openstep-parser
          python3 scripts/audit-swift-registration.py
      - name: swift-case-spelling
        run: python3 scripts/swift-spelling-check.py
      - name: port-surface-audit (informational)
        # [BATCH-B 2026-09-22] audit-port-surface.py used to return 0 unconditionally and
        # was wired nowhere. It stays a NON-GATE on purpose (its A check has an unfinished
        # guard stub, its C check prints 298 heuristic hits — see the script header).
        # What is fixed here: (1) it now exits 2 on a vacuous run (empty input surface),
        # so it can no longer die while looking clean; (2) it runs on every CI pass so its
        # early signal is actually visible. continue-on-error = it must never block a PR;
        # a step failure here means "the tool broke / found new debts", human-triaged.
        continue-on-error: true
        run: python3 scripts/audit-port-surface.py
      - name: Cache Linux Swift toolchain
        # ~700 MB tarball; ci job is otherwise a 20s job. Cache the extracted dir.
        uses: actions/cache@v4
        with:
          path: ~/swift-dist
          key: swiftdist-${{ runner.os }}-swift-6.0.3-RELEASE-ubuntu24.04
      - name: swift-syntax-parse
        run: |
          set -euo pipefail
          REL=swift-6.0.3-RELEASE
          DEST="$HOME/swift-dist"
          # Locate swiftc by shape, never by a guessed directory name: run 35552014592
          # 404'd because the archive path is <REL>/<REL>-ubuntu24.04.tar.gz while the
          # extracted top dir keeps the -ubuntu24.04 suffix (two different strings).
          # Do NOT add `-type f`: usr/bin/swiftc is a SYMLINK to swift-driver, so a
          # regular-file filter returns nothing (run 35553111466, empty $SWIFTC ->
          # gate correctly fail-closed). -x follows the link and proves it is runnable.
          SWIFTC=$(find "$DEST" -path '*/usr/bin/swiftc' -xtype f 2>/dev/null | head -1 || true)
          [ -n "$SWIFTC" ] && [ -x "$SWIFTC" ] || SWIFTC=""
          if [ -z "$SWIFTC" ]; then
            curl -sSfL --retry 3 \
              "https://download.swift.org/swift-6.0.3-release/ubuntu2404/${REL}/${REL}-ubuntu24.04.tar.gz" \
              -o /tmp/swift.tgz
            mkdir -p "$DEST"
            tar -xzf /tmp/swift.tgz -C "$DEST"
            rm -f /tmp/swift.tgz
            SWIFTC=$(find "$DEST" -path '*/usr/bin/swiftc' -xtype f 2>/dev/null | head -1 || true)
          fi
          if [ -z "$SWIFTC" ]; then
            echo "::error::swift-syntax-parse found no runnable swiftc under $DEST — refusing to report a vacuous green"
            find "$DEST" -maxdepth 4 -name 'swift*' 2>/dev/null | head -20
            exit 3
          fi
          echo "toolchain: $SWIFTC"
          SWIFTC="$SWIFTC" bash scripts/swift-parse-check.sh
