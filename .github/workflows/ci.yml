name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: gitleaks range-scans multi-commit pushes; shallow clone
          # made `base^..head` unresolvable -> ERR "partial scan" exit 1 (2026-09-15)
          fetch-depth: 0
      # [CI-FIX-2026-09-17] gitleaks-action v2 now hard-fails without a paid
      # GITLEAKS_LICENSE ("License key validation will be enforced") and died
      # on anonymous API rate limits — run the OSS binary directly instead.
      # Same scan surface: full git history (fetch-depth: 0), repo .gitleaks.toml.
      - name: secret-scan
        run: |
          # Pinned release tarball: the raw install.sh one-liner 404s now, and
          # v8.30+ strictly validates .gitleaks.toml (config fixed to [[rules]]+id).
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --verbose
      - name: import-direction
        run: bash scripts/import-scan.sh
      - name: pbxproj-input-audit
        run: |
          python3 -m pip install --quiet openstep-parser
          python3 scripts/audit-project-inputs.py
      - name: aa-assets-completeness
        run: python3 scripts/audit-aa-assets.py
      - name: fork-point
        run: bash scripts/fork-point-audit.sh
      - name: aav2-freeze
        run: bash scripts/aav2-freeze-check.sh
